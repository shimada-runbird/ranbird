<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUZZ+ ロゴ</title>
  <style>
    :root { --navy: #101d3f; --orange: #f59e0b; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #f8fafc; color: var(--navy); padding: 48px 24px 80px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 32px; letter-spacing: -0.04em; margin: 0 0 8px; }
    h1 span { color: var(--orange); font-weight: 300; }
    .lead { color: #64748b; margin-bottom: 40px; font-size: 15px; }
    .hero {
      background: #fff; border: 1px solid var(--line); border-radius: 24px;
      padding: 64px 40px; text-align: center; margin-bottom: 32px;
    }
    .hero img { max-width: min(100%, 420px); height: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .cell {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 32px 20px; display: flex; align-items: center; justify-content: center;
      min-height: 140px;
    }
    .cell--dark { background: var(--navy); border-color: var(--navy); }
    .cell img { max-width: 100%; height: auto; }
    .label { font-size: 12px; font-weight: 600; color: #64748b; margin-top: 8px; text-align: center; }
    .dl { margin-top: 32px; font-size: 14px; }
    .dl a { display: inline-block; margin: 4px 16px 4px 0; color: var(--navy); font-weight: 600; }
    a.back { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a class="back" href="index.html">← 全ロゴ案 A〜D</a></p>
    <h1>BUZZ<span>+</span> <span style="font-size:14px;font-weight:600;background:#101d3f;color:#fff;padding:4px 10px;border-radius:999px;vertical-align:middle">確定版</span></h1>
    <p class="lead">2026-05-22 確定｜正本は BUZZplus_確定版_* ファイル</p>

    <div class="hero">
      <img src="BUZZplus_確定版_横型_タグライン付き.svg" alt="BUZZ+ 確定 横型">
    </div>
    <img src="BUZZplus_確定版_横型と正方形.png" alt="BUZZ+ 確定 PNG" style="width:100%;max-width:640px;border-radius:16px;border:1px solid var(--line);margin-bottom:32px">

    <div class="grid">
      <div>
        <div class="cell"><img src="logo-e-buzz-plus-square.svg" alt="白背景正方形"></div>
        <p class="label">正方形（白）</p>
      </div>
      <div>
        <div class="cell cell--dark"><img src="logo-e-buzz-plus-dark.svg" alt="ネイビー正方形"></div>
        <p class="label">正方形（ネイビー）</p>
      </div>
      <div>
        <div class="cell"><img src="logo-e-buzz-plus-tagline.svg" alt="タグライン付き"></div>
        <p class="label">横型＋タグライン</p>
      </div>
      <div>
        <div class="cell cell--dark"><img src="logo-e-buzz-plus-boxed.svg" alt="ボックス型"></div>
        <p class="label">ボックス（資料ヘッダ向け）</p>
      </div>
    </div>

    <p class="dl">
      <a href="BUZZplus_確定版_横型と正方形.png" download>確定 PNG</a>
      <a href="BUZZplus_確定版_横型.svg" download>横型 SVG</a>
      <a href="BUZZplus_確定版_横型_タグライン付き.svg" download>タグライン付き SVG</a>
      <a href="BUZZplus_確定版_正方形.svg" download>正方形 SVG</a>
      <a href="BUZZplus_確定版_正方形_ネイビー背景.svg" download>ネイビー正方形 SVG</a>
      <a href="BUZZplus_確定版_ボックス.svg" download>ボックス SVG</a>
    </p>
  </div>
</body>
</html>
